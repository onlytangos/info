<style>

<script src='data/aux.js'></script>  <!-- ROLES y favoritos, compartido con comun.py -->
<script id='fuente1' src='data/publicEvent.out.js'></script>
<script id='fuente2' src='data/publicPeople.out.js'></script>
<script id='fuente3' src='data/privatePeople.out.js'></script>
<script id='fuente4' src='review/fotoid.js'></script>  <!-- fotosId: fotos de review/foto0,1,2,9/ (opcional) -->


<script>

// indices de los 9 campos de cada fila de datos: CAMPO (data/aux.js)

const meses=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const opcionesVistas=['countries','annual','regular'];
const opcionesFav=['fav','fav2'];   // no son vistas: recargan la pagina con ?vista=annual&fav&area=Asia / ?vista=annual&fav2&area=Asia

// textos por defecto de cada selector
const fsel0='> all area';
const fsel1='> all country';
const fsel2='> all city';
const fsel3='> all type';
const fsel4='> all dates';
const textoFav={fav:'mis favoritos',fav2:'mi agenda'};   // texto de opcionesFav en el selector de vista
const fsel5=opcionesVistas[0];

// estado global
var datos=[];
var datosAll=[];
var busqueda='';
var colorTipo=new Map();
var titulo1,titulo2;
var parametros={};
var ocultar='';
var app;
var filasVisibles=new Set();   // filas (arrays de datos) pintadas en el listado actual

const MAXSEL=13;

function borraParametros() {
	// Limpia los parametros de la URL visible una vez ya leidos en parametros{}.
	const url = new URL(window.location.href);
	if (url.search) {
		url.search = '';
		window.history.replaceState(null, document.title, url.toString());
	}
}

function readParam(){
	// Vuelca los parametros de la URL en parametros{} y rellena los que falten
	// con sus valores por defecto (app=mundo, vista=countries, etc.).
	const params = new URLSearchParams(window.location.search);
	for (const [clave, valor] of params.entries()) {
		parametros[clave] = valor;
	}
	const defecto={app:'mundo',area:fsel0,pais:fsel1,ciudad:fsel2,tipo:fsel3,fecha:fsel4,vista:fsel5};
	for (const clave in defecto){
		if (parametros[clave]==undefined){ parametros[clave]=defecto[clave]; }
	}
}

function peopleDisponible(){
	// privatePeople.out.js no se sube a la web: si no esta cargado, usa publicPeople.
	return (typeof privatePeople!='undefined') ? privatePeople : publicPeople;
}

const COLOR_TIPO_MUNDO={'milonga':'#adf5d7','venue':'#fae3ad','event':'#e5f9ff','event party':'#d7f6fa',
	'event festival':'#c3e8ff','event encuentro':'#7db1ff','event marathon':'#acccfc',
	'event championship':'#ff6961','venue academy':'#f3d4ff','list':'#e0d4f7'};   // color de cada tipo de evento (app mundo)

function eligeDatos(){
	// datos, titulos y colores por tipo segun la app (mundo: eventos y
	// personas; people: solo personas). Los colores de los roles, de aux.js
	if (app=='mundo'){
		datos=publicEvent.concat(peopleDisponible());   // privado si existe (local), si no el público (web)
		titulo1='OnlyTangoInfo';
		titulo2='<a href="https://www.facebook.com/profile.php?id=100093497583670" target="_blank">by KoKoTango</a>'+
			// versión: privada (local, con privatePeople.out.js) o pública (la web, sin él), como caras.htm
			'<br><small>'+(typeof privatePeople!='undefined' ? 'private version' : 'public version')+'</small>';
		for (const t in COLOR_TIPO_MUNDO){ colorTipo.set(t,COLOR_TIPO_MUNDO[t]); }
		for (const r in ROLES){ colorTipo.set(r,ROLES[r].color); }
	}
	if(app=='people'){
		datos=peopleDisponible();   // privado contiene a todos; publicPeople es un subconjunto
		titulo1=`People &#128518; `;
		titulo2='';
		for (const r in ROLES){ colorTipo.set(r,ROLES[r].colorPeople); }
	}
	datosAll=datos;
}

function div(id,html){
	const d=document.createElement('div');
	d.id=id;
	if (html!=undefined){ d.innerHTML=html; }
	return d;
}

function montaMenu(){
	// la cabecera fija: titulos, sumario, buscador, selectores y exportar
	const fijo=div('fijo');
	document.body.appendChild(fijo);
	fijo.appendChild(div('titulo1',titulo1));
	fijo.appendChild(div('titulo2',titulo2+'<br/><br/>'));
	fijo.appendChild(div('sumario'));
	if (app=='mundo' || app=='people'){
		crearBuscador(fijo);
		setParametrosSelectores(fijo);
		setSel();
		crearBotonExport(fijo);
	}
}

function inicio(){
	// Punto de entrada (window.onload): elige el dataset segun app, monta el
	// menu lateral con los selectores y pinta el primer listado.
	readParam();
	app=parametros.app;
	eligeDatos();
	montaMenu();
	const results=document.createElement('ul');
	results.id='resultados';
	results.style.marginTop='10px';
	document.body.appendChild(results);
	cargaFavoritos();
	renderGo();
	borraParametros();
}

function setParametrosSelectores(fijo){
	// Crea en cadena todos los selectores del menu (vista, area, pais, ciudad,
	// tipo, fechas) y aplica a cada uno el valor que venga en los parametros.
	if (app!='people'){
		fijo.appendChild(crearSel5());
		cambiarValorSelector('selector5',parametros.vista);
	}
	fijo.appendChild(crearSelAreas());
	cambiarValorSelector('selector0',parametros.area);
	fijo.appendChild(crearSelect('selector1',change1));
	crearSelCountry();
	cambiarValorSelector('selector1',parametros.pais);
	fijo.appendChild(crearSelect('selector2',change2));
	crearSelCity();
	cambiarValorSelector('selector2',parametros.ciudad);
	fijo.appendChild(crearSelect('selector3',change3));
	crearSelType();
	cambiarValorSelector('selector3',parametros.tipo);
	if (app!='people'){
		fijo.appendChild(crearSelect('selector4',change4));
		crearSelDates();
		cambiarValorSelector('selector4',parametros.fecha);
	}
}

function crearBotonExport(fijo){
	// Boton 'export' debajo de los selectores. Solo si esta privatePeople
	// (local): en la web no se sube y el boton no se muestra.
	if (typeof privatePeople=='undefined'){return}
	const b=document.createElement('button');
	b.id='exportar';
	b.textContent='export';
	b.addEventListener('click',exportar);
	fijo.appendChild(b);
	// debajo: dia del ultimo import (lo escribe import.sh en publicEvent.out.js)
	if (typeof publicEventFecha!='undefined'){
		const u=document.createElement('div');
		u.id='update';
		u.textContent='update: '+publicEventFecha;
		fijo.appendChild(u);
	}
}

function exportar(){
	// Descarga export.json con las filas que se ven en el listado (personas,
	// eventos, venues y milongas), en el mismo formato que los demas res*.json
	// del import: array JSON, una fila de 9 campos por linea.
	// Para mirarlo o usarlo a mano: no lo lee el import ni ningún script.
	const filas=datos.filter(f => filasVisibles.has(f));
	if (!filas.length){ return }
	const cuerpo=filas.map(f => '  ['+f.map(v => JSON.stringify(v)).join(', ')+']').join(',\n');
	bajaFichero('export.json','[\n'+cuerpo+'\n]\n','application/json');
}

function cambiarValorSelector(idSelector, nuevoValor) {
	// Selecciona nuevoValor en el selector dado solo si esa opcion existe;
	// si no, lo deja como esta (sin lanzar error).
	const selector=document.getElementById(idSelector);
	if (!selector || !nuevoValor){return}
	for (const option of selector.options) {
		if (option.value===nuevoValor){
			selector.value=nuevoValor;
			return;
		}
	}
}

function crearSelect(id,alCambiar){
	// Crea un selector vacio (lo llena su crearSel*: crearSelCountry,
	// crearSelCity, crearSelType, crearSelDates) que llama a alCambiar
	const select=document.createElement('select');
	select.id=id;
	select.addEventListener('change',alCambiar);
	return select;
}

function crearSel5(){
	// Crea el selector de vista (selector5): countries / annual / regular.
	// El valor sigue siendo countries aunque diga 'by locations' (enlaces ?vista=)
	const select=crearSelect('selector5',change5);
	opcionesVistas.concat(opcionesFav).forEach(x =>
		opcionTexto(select,x,textoFav[x] || 'by '+(x=='countries' ? 'locations' : x)));
	return select;
}

// ── Favoritos (var favoritos de aux.js) ──
// Un favorito es de un evento de su misma ciudad si todas las palabras de su
// nombre estan en el nombre del evento (normalizados: sin mayusculas, tildes
// ni parentesis). Vale un nombre incompleto ('Busan Tango Marathon' = 'Busan
// Tango Marathon 2026'). Misma regla que fav_de() de paso1, que avisa de los
// que no casan o casan con varios.
const FAV_ICONO={home:'&#128726;',go:'&#11088;',think:'&#10067;'};   // 🛖 ⭐ ❓ (estados de aux.js)

function normalizarFav(s){
	// Copia de normalizar() de comun.py
	s=String(s).replace(/\(.*?\)/g,' ').trim().toLowerCase().normalize('NFD').replace(/\p{Mn}/gu,'');
	s=s.replace(/[^\p{L}\p{N}_\s]/gu,' ').replace(/[^\x00-\x7f]/g,'');
	return s.replace(/\s+/g,' ').trim();
}

function palabrasFav(nombre){
	return new Set(normalizarFav(nombre).split(' ').filter(Boolean));
}

const favLista=[];   // {palabras (del nombre), ciudad, estado} de cada favorito

function estadoFav(nombre,ciudad){
	// estado del favorito del evento (nombre, ciudad), '' si no lo es
	const c=normalizarFav(ciudad), p=palabrasFav(nombre);
	const f=favLista.find(f => f.ciudad==c && f.palabras.size && [...f.palabras].every(w => p.has(w)));
	return f ? f.estado : '';
}

const FAV2=['home','go'];   // estados que se ven con ?fav2

function pasaFav2(item){
	// Con ?fav2 solo pasan los eventos favoritos en estado FAV2 (home/go).
	// Sin ?fav2, o sin favoritos, pasa todo.
	if (parametros.fav2==undefined || !favLista.length){return true}
	return String(item.tipo).startsWith('event') &&
		FAV2.includes(estadoFav(item.nombre,item.ciudad));
}

function cargaFavoritos(){
	// Usa los favoritos solo con ?fav o ?fav2 en la url (en local y en la web).
	// ?fav2 ademas filtra el listado a los favoritos home/go (pasaFav2).
	// Sin ellos el listado queda como sin favoritos.
	if (parametros.fav==undefined && parametros.fav2==undefined){return}
	if (typeof favoritos=='undefined'){return}
	// favoritos: filas [nombre, ciudad, estado]
	for (const [n,c,estado] of favoritos){
		favLista.push({palabras:palabrasFav(n), ciudad:normalizarFav(c||''), estado});
	}
}

// ── Fotos (review/fotoid.js, opcional; lo genera review/fotoid.py) ──
// El campo 9 de cada fila (CAMPO.idfoto) es el id de su foto (6 letras), "-"
// si no tiene. Con ese id puede haber foto en review/foto0/ (a mano), foto1/
// (perfil), foto2/ (portada) y foto9/ (dudosas): se toma la primera en orden
// 0,1,2,9 (eventos 0,2,1,9: la portada antes). fotosId[carpeta] = ['<id>.jpg',...]
function iconoFoto(idfoto,evento){
	// Enlace 👤 a la foto de la persona o evento; si no tiene, ''.
	// (fotoDeId de aux.js)
	const f=fotoDeId(idfoto,evento);
	return f ? '<a href="review/foto'+f.carpeta+'/'+f.fichero+'" onclick="return toggleFoto(this)">'+icon('user')+'</a>' : '';
}
function toggleFoto(a){
	// Click en 👤: muestra la foto justo al lado del 👤; otro click en 👤 o en la foto la quita.
	// (onclick en linea: sobrevive al innerHTML+= del render)
	const sig=a.nextElementSibling;
	if (sig && sig.classList.contains('fotoPerfil')){ sig.remove(); return false; }
	const nueva=document.createElement('img');
	nueva.className='fotoPerfil';
	nueva.src=a.getAttribute('href');
	nueva.alt='';
	nueva.style.cursor='pointer';
	nueva.onclick=function(){ nueva.remove(); };   // click en la foto: se cierra
	a.after(nueva);
	return false;
}

function iconoFav(nombre,ciudad){
	// Emoji del estado del favorito (con espacio detras) o '' si no lo es.
	const e=estadoFav(nombre,ciudad);
	return e ? '<span class="fav" title="'+e+'">'+(FAV_ICONO[e]||'&#10067;')+'</span>&nbsp;' : '';
}


function esc(s){
	// Escapa &, < y > de un texto antes de meterlo en innerHTML (evita romper
	// el maquetado o inyectar HTML desde los datos).
	return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const ICONS={
	// imitan los emoji: ▶️ cuadrado naranja, ↗️ gris azulado, con simbolo blanco; 👤 silueta azul
	play:'<rect x="1" y="1" width="22" height="22" rx="5" fill="#f5a623"/>'+
		'<path d="M9 6.5v11l9-5.5z" fill="#fff"/>',
	external:'<rect x="1" y="1" width="22" height="22" rx="5" fill="#6d8aa6"/>'+
		'<path d="M7.5 16.5l9-9M10 7.5h6.5V14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
	// 🌐 web (www de varios): globo verde
	web:'<circle cx="12" cy="12" r="10.5" fill="#3a9d5d"/>'+
		'<path d="M1.5 12h21M12 1.5c-3.5 3-3.5 18 0 21M12 1.5c3.5 3 3.5 18 0 21" fill="none" stroke="#fff" stroke-width="1.6"/>',
	user:'<circle cx="12" cy="7.5" r="5" fill="#3b8ee8"/>'+
		'<path d="M2 23c0-6.2 4.5-9.5 10-9.5s10 3.3 10 9.5z" fill="#3b8ee8"/>'
};
function icon(nombre,size){
	// SVG en linea con el aspecto del emoji original; size por defecto 1.1em
	size=size||'1.1em';
	return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" '+
		'aria-hidden="true">'+(ICONS[nombre]||'')+'</svg>';
}

// urls en un texto: con http(s)://, con www. o un dominio suelto (tangoenvinilo.com, cafe.naver.com/x)
const RE_URL=/(?:https?:\/\/|www\.)[^\s|#]+|(?<![@\w.\/-])[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|kr|es|fr|it|de|tw|jp|cn|be|io|me|tv|info|ar|uy|ly)(?:\/[^\s|#]*)?(?![\w@.-])/gi;
function conHttp(u){ return /^https?:\/\//i.test(u) ? u : 'https://'+u; }
function urlsDe(subcampos,excluir){
	// urls de una lista de textos, sin repetir y sin la url excluir (la del ↗️)
	const vistas=new Set([excluir ? claveUrl(excluir) : '']), res=[];
	for (const x of subcampos) for (const u of String(x).match(RE_URL)||[]){
		const k=claveUrl(u);
		if (!vistas.has(k)){ vistas.add(k); res.push(conHttp(u)); }
	}
	return res;
}
function sinUrls(t){
	// el texto sin urls ni separadores sueltos en los extremos
	return String(t).replace(RE_URL,' ').replace(/\s+/g,' ').replace(/^[\s,;|\/:-]+|[\s,;|\/:-]+$/g,'');
}
function iconoUrl(u,vid){
	// enlace con icono: ▶️ si es un vídeo (subcampo vid, o YouTube), 🌐 si es otra web
	return '<a href="'+u.replace(/"/g,'%22')+'" target="_blank">'+
		icon(vid || /^https?:\/\/([a-z0-9-]+\.)*(youtube\.com|youtu\.be)\//i.test(u) ? 'play' : 'web')+'</a>';
}
function contactosVarios(v){
	// ins (enlace a Instagram), ema (mailto), tel, wec y kak (texto; kak con url, enlace)
	const a=(href,t) => '<a href="'+href.replace(/"/g,'%22')+'" target="_blank">'+esc(t)+'</a>';
	return [...(v.ins||[]).map(u => a('https://www.instagram.com/'+encodeURIComponent(u)+'/','@'+u)),
		...(v.ema||[]).map(e => a('mailto:'+e,e)),
		...(v.tel||[]).map(t => esc('☎ '+t)),
		...(v.wec||[]).map(w => esc('WeChat '+w)),
		...(v.kak||[]).map(k => /^https?:\/\//.test(k) ? a(k,'Kakao') : esc('Kakao '+k))].join(' ');
}
function iconosVarios(v,excluir){
	// iconos de los vid (▶️), los www y las urls dentro de los txt (🌐), sin repetir ni excluir (la del ↗️)
	const vids=urlsDe(v.vid||[],excluir);
	const otras=urlsDe([...(v.www||[]),...(v.txt||[])],excluir).filter(u => !vids.includes(u));
	return [...vids.map(u => iconoUrl(u,true)),...otras.map(u => iconoUrl(u))].join(' ');
}
function spanRoles(tipo,sep){
	// Lista de roles ('org,art,p26') con una etiqueta de color por rol
	// (colorTipo, gris si no está), en orden alfabético ('art,org,p26');
	// separados por sep (',' por defecto).
	return String(tipo).split(',').map(r => r.trim()).filter(r => r && r!='-').sort().map(r =>
		'<span style="background-color:'+(colorTipo.get(r)||'#DDD')+'">'+esc(r)+'</span>'
	).join(sep==undefined ? ',' : sep);
}

function opTxt(t,n){
	// Etiqueta de una opcion de selector: recorta el texto con '..' si pasa de
	// MAXSEL y le añade el contador (n) entre parentesis.
	let s=String(t);
	if (s.length>MAXSEL){ s=s.slice(0,MAXSEL-2)+'..'; }
	return (n!=undefined) ? s+' ('+n+')' : s;
}

function createOpt(s,v,t,n){
	// <option> value=v con la etiqueta opTxt(t,n) (con el contador) en el select s
	opcionTexto(s,v,opTxt(t,n));
}

function get3(a){
	// Codigo de 3 letras de un tipo: su ultima palabra ('event festival' -> 'FES',
	// 'venue academy' -> 'ACA', 'venue' -> 'VEN'); 'event' devuelve 'EVT'.
	// Rellena con '-' si tiene menos de 3 letras.
	if (a=='event'){
		return 'EVT';
	}
	const ps=String(a).trim().split(' ');
	return ps[ps.length-1].slice(0,3).toUpperCase().padEnd(3, '-');
}

function addTiposEvento(select,cuentas,conPrefijo){
	// Añade una <option> por cada tipo de evento (event/venue/milonga) presente
	// en 'cuentas', en orden alfabetico. Compartido por las vistas countries y
	// annual; 'conPrefijo' antepone el codigo de 3 letras (ej. 'MAR.marathon').
	claves(cuentas).forEach(x => {
		if (x=='event' || x=='list' || !esEvento(x)){return}   // list: opcion propia, al inicio
		let y=x.replace('event ','').trim();
		if (y=='championship'){y='champion'}
		createOpt(select,x,conPrefijo?get3(y)+'.'+y:y,cuentas.get(x)||0);
	});
}

function vaciaSelect(select,textoDefecto){

}

function opcionesCuenta(select,valores,cuentas,sufijo){

	valores.forEach(x => opcionTexto(select,x,opTxt(x,cuentas.get(x)||0)+(sufijo ? sufijo(x) : '')));

function opcionTexto(dest,valor,texto){
	// <option> value=valor con la etiqueta texto, tal cual, en dest
	const opt=document.createElement('option');
	opt.value=valor;
	opt.textContent=texto;
	dest.appendChild(opt);
}

function tiposMundo(select){
	// list primero; despues dos grupos (optgroup), events y people, cada
	// uno con su opcion de todos (events / people) al principio
	const cuentas=cuentaCol2(CAMPO.tiporol);
	createOpt(select,'list','list',sumaCuenta(cuentas,'list'));   // fuentes de informacion
	const grupo=label => { const g=document.createElement('optgroup'); g.label=label; select.appendChild(g); return g; };
	const gEv=grupo('events');
	createOpt(gEv,'*','events',cuentaFilasTipo('*'));     // todos los eventos: event, venue y milonga
	createOpt(gEv,'event','event*',sumaCuenta(cuentas,'event'));
	addTiposEvento(gEv,cuentas,true);
	const gPe=grupo('people');
	createOpt(gPe,'!','people',cuentaFilasTipo('!'));   // todas las personas, con o sin rol
	createOpt(gPe,'+'+rolesPeople.join(','),'peopleRol',cuentaFilasTipo('+'+rolesPeople.join(',')));
	opcionesPeople(gPe);
	claves(cuentas).forEach(x => {
		if (esEvento(x)){return}
		createOpt(gPe,x.split(' ')[0],x,cuentas.get(x)||0);
		gPe.lastChild.textContent+=sufijoRol(x);
	});
}

function crearBuscador(fijo){
	// Crea la caja de busqueda. Texto normal filtra en vivo todos los campos;
	// texto que empieza por '-' es un comando que se ejecuta al pulsar Enter.
	const inp=document.createElement('input');
	inp.id='buscador';
	inp.type='search';
	inp.placeholder='buscar...';
	inp.addEventListener('input',aplicarBusqueda);
	inp.addEventListener('keydown',function(e){
		if (e.key=='Enter'){
			let txt=inp.value.trim();
			if (txt.startsWith('-')){ ejecutaComando(txt.toLowerCase()); }
		}
	});
	fijo.appendChild(inp);
}

function aplicarBusqueda(){
	// Filtra datosAll por el texto del buscador (todas las palabras deben
	// aparecer en algun campo) y reajusta los selectores. Si empieza por '-'
	// es un comando y no se busca.
	const inp=document.getElementById('buscador');
	let txt=inp ? inp.value.trim() : '';
	if (txt.startsWith('-')){
		return;
	}
	busqueda=txt.toLowerCase();
	if (busqueda==''){
		datos=datosAll;
	}else{
		let terms=busqueda.split(/\s+/).filter(Boolean);
		datos=datosAll.filter(fila => {
			let hay=fila.join(' ').toLowerCase();
			return terms.every(t => hay.indexOf(t)!=-1);
		});
	}
	recargarSelectores();
}

	// Reajusta todos los selectores al dataset activo, resetea el area y repinta.
	repoblarAreas();
	document.getElementById('selector0').value='';

	if (app!='people'){ crearSelDates(); }

	renderGo();
}

function claves(m){
	// Claves de un Map (cuentaCol*) ordenadas alfabeticamente = los valores
	// unicos de un selector. Misma fuente que su contador, asi lista y contador
	// nunca se desincronizan. No se trocea por espacios (hay 'South Korea').
	return [...m.keys()].sort();
}

function damecol(col1){
	// Lista ordenada de valores unicos de una columna (sin contador).
	return claves(cuentaCol(col1));
}

function damecol1(col,col1,v1){
	// Lista ordenada de valores unicos de col en las filas donde col1==v1.
	return claves(cuentaCol(col,col1,v1));
}

function prefijoVista(){
	// Prefijo de fecha que define que filas cuentan segun la vista: 'REG'
	// (regular), 'EVT' (annual) o '' (countries, todas).
	const vista=valorVisible('selector5');
	if (vista=='regular'){return 'REG'}
	if (vista=='annual'){return 'EVT'}
	return '';
}

// nombre de cada rol: se muestra en el selector detras del contador (vacio = sin nombre)
const NOMBRE_ROL={'-':'sin rol', ...Object.fromEntries(Object.keys(ROLES).map(r => [r,ROLES[r].nombre]))};
function sufijoRol(r){ const n=NOMBRE_ROL[r]; return n ? ' '+n : ''; }

const rolesPublicos=Object.keys(ROLES).filter(r => ROLES[r].publico);   // ROLES_PUBLICOS en comun.py
const rolesPeople=Object.keys(ROLES);                                     // ROLES_VALIDOS en comun.py (públicos + privados)

function ocultoEnAnual(tipo){
	// Tipos que no se muestran en la vista annual (ni lista, ni contadores).
	return String(tipo).indexOf('seminar')!=-1;
}

function filaEnVista(fila,pref){
	// true si la fila pertenece a la vista activa (REG/EVT comparan el
	// prefijo de fecha; '' acepta todas). En annual (EVT) omite los seminar.
	if (pref==''){return true}
	if (pref=='EVT' && ocultoEnAnual(fila[CAMPO.tiporol])){return false}
	return fechaDe(fila).split('.')[0]==pref;
}

function cuentaCol(col,col1,v1){
	// Map valor->ocurrencias de la columna col, contando solo las filas de la
	// vista activa (prefijoVista) y, con col1, las que tienen col1==v1 (o v1=='all').
	const pref=prefijoVista();
	const m=new Map();
	for (const fila of datos){
		if (!filaEnVista(fila,pref)){continue}
		if (col1!=undefined && v1!='all' && fila[col1]!=v1){continue}
		const v=fila[col];
		if (v!=''){ m.set(v,(m.get(v)||0)+1); }
	}
	return m;
}

function cuentaCol2(col){
	// Map valor->ocurrencias de una columna filtrando por el pais (selector1)
	// y la ciudad (selector2) elegidos; trocea el campo por comas. col: posicion
	// (CAMPO.x) o funcion que saca el valor de la fila (fechaDe).
	const valorDe=(typeof col=='function') ? col : (fila => fila[col]);
	let v1=document.getElementById('selector1').value;
	let v2=document.getElementById('selector2').value;
	let col1=CAMPO.country;
	let col2=CAMPO.city;
	const m=new Map();
	for (let i=0;i<datos.length;i++){
		if(v1=='all' || v1=='' || datos[i][col1]==v1){
			if(v2=='all' || v2=='' || datos[i][col2]==v2){
				let valor=String(valorDe(datos[i])).split(',');
				for (let k=0;k<valor.length;k++){
					if (valor[k]!=''){ m.set(valor[k],(m.get(valor[k])||0)+1); }
				}
			}
		}
	}
	return m;
}

function sumaCuenta(mapa, valorLista){
	// Suma las ocurrencias de un grupo de tipos. valorLista puede ser una lista
	// por comas ('artist,organizer') o un prefijo ('event').
	let total=0;
	let claves=valorLista.split(',');
	for (const [k,v] of mapa){
		if (claves.includes(k) || claves.includes(k.split(' ')[0])){ total+=v; }
	}
	return total;
}

function cuentaFilasTipo(valorLista){
	// Cuenta FILAS (no ocurrencias) cuyo tipo contiene alguno de los valores,
	// con los mismos filtros pais/ciudad que cuentaCol2 y el mismo criterio
	// de coincidencia que el render (filtra). Una persona con varios roles
	// cuenta una sola vez: el contador coincide con los resultados pintados.
	let v1=document.getElementById('selector1').value;
	let v2=document.getElementById('selector2').value;
	let total=0;
	for (let i=0;i<datos.length;i++){
		if(v1=='all' || v1=='' || datos[i][CAMPO.country]==v1){
			if(v2=='all' || v2=='' || datos[i][CAMPO.city]==v2){
				if (filtra(valorLista,datos[i][CAMPO.tiporol])!=-1){ total++; }
			}
		}
	}
	return total;
}

function cuentaTipoEVT(){
	// Contador para la vista annual: cuenta por tipo solo eventos EVT con
	// fecha, respetando el unico filtro visible en annual (el area).
	const v0=document.getElementById('selector0').value;
	const m=new Map();
	for (let i=0;i<datos.length;i++){
		if (v0!='' && v0!='all' && datos[i][CAMPO.area]!=v0){continue}
		let f=fechaDe(datos[i]);
		if (f=='-' || f==''){continue}
		if (f.split('.')[0]!='EVT'){continue}
		let t=datos[i][CAMPO.tiporol];
		if (ocultoEnAnual(t)){continue}
		if (t!=''){ m.set(t,(m.get(t)||0)+1); }
	}
	return m;
}

function cuentaFechas(){
	// Cuenta cuantos eventos caen en cada mes (3er campo de la fecha EVT),
	// respetando los filtros visibles (area, pais, ciudad, tipo). Las REG no
	// tienen mes y no se cuentan.
	let s0=valorVisible('selector0');
	let s1=valorVisible('selector1');
	let s2=valorVisible('selector2');
	let s3=valorVisible('selector3');
	const anual=(prefijoVista()=='EVT');
	const m=new Map();
	for (let i=0;i<datos.length;i++){
		let d=datos[i];
		if (anual && ocultoEnAnual(d[CAMPO.tiporol])){continue}
		if (s0!='' && s0!='all' && d[CAMPO.area]!=s0){continue}
		if (s1!='' && s1!='all' && d[CAMPO.country]!=s1){continue}
		if (s2!='' && s2!='all' && d[CAMPO.city]!=s2){continue}
		if (s3!='' && s3!='all' && filtra(s3,d[CAMPO.tiporol])==-1){continue}
		let mes=fechaDe(d).split('.')[2];
		if (meses.indexOf(mes)!=-1){ m.set(mes,(m.get(mes)||0)+1); }
	}
	return m;
}

function getObj(i){
	// Convierte la fila i de datos (array de 9 campos) en un objeto con nombres.
	let o={
			pais:datos[i][CAMPO.country],
			ciudad:datos[i][CAMPO.city],
			tipo:datos[i][CAMPO.tiporol],
			nombre:datos[i][CAMPO.name],
			varios:leeVarios(datos[i]),       // {nom: [valores]} (aux.js)
			fechas:fechaDe(datos[i]),         // eventos: subcampo fec de varios
			privado:datos[i][CAMPO.private],  // people: comentarios privados
			url:datos[i][CAMPO.urlfb],
			idfoto:datos[i][CAMPO.idfoto]||'',  // campo 9: id de la foto, "-" sin foto
			fila:datos[i],
	}
	return o;
}

function damelista(pais){
	// Devuelve, como objetos, todas las filas cuyo pais coincide, en orden.
	let res=[];
	for (let i=0;i<datos.length;i++){
		if (pais==datos[i][CAMPO.country]){
			res.push(getObj(i));
		}
	}
	return res;
}

function filtra(cadena1,cadena2){
	// Devuelve 1 si alguna palabra de cadena1 (lista por comas) aparece en
	// cadena2; si no, -1.
	// Prefijos especiales (roles exactos, no subcadena):
	//  '+r1,r2' : tiene alguno de esos roles (peoplePublic)
	//  '!r1,r2' : persona (no evento/venue/milonga) sin ninguno de esos roles (peoplePrivate)
	//  '!'      : sin lista, cualquier persona (people)
	//  '*'      : cualquier evento, venue o milonga (events), no las list
	if (cadena1=='*'){ return (esEvento(cadena2) && cadena2!='list') ? 1 : -1; }
	if (cadena1[0]=='+' || cadena1[0]=='!'){
		const roles=String(cadena2).split(',').map(r => r.trim());
		const hay=cadena1.slice(1).split(',').some(r => roles.includes(r));
		if (cadena1[0]=='+'){ return hay ? 1 : -1; }
		return (!hay && !esEvento(cadena2)) ? 1 : -1;
	}
	let lista1=cadena1.split(',');
	for (const x of lista1){
		if (cadena2.indexOf(x)!=-1){
			return 1;
		}
	}
	return -1;
}


function listaPaises(s0,s1){
	// Paises a recorrer en el render segun el area (s0) y el pais (s1) elegidos.
	// Con area, tambien '-': las filas del area sin pais (enArea), como el PTC de Asia.
	if (s1!='' && s1!='all'){ return [s1]; }
	if (s0==''){ return damecol(CAMPO.country); }
	const l=damecol1(CAMPO.country,CAMPO.area,s0);
	return l.includes('-') ? l : l.concat('-');
}

function omitirPais(area,s0,s1,s2,s3){
	// '-' y '.' son ubicaciones vacias (sin pais): con pais o ciudad elegidos se
	// omiten; sin filtro salen todas y con solo un area, las de esa area (enArea).
	return (area=='-'||area=='.') && (s1!=''||s2!='');
}

function enArea(item,s0){
	// Con un area elegida, solo las filas de esa area: damelista junta por pais
	// (un pais con filas en otra area, o el grupo sin pais, traeria las de otras
	// areas). Con el area '-', solo las que no tienen area. Asi el listado cuenta
	// lo mismo que el selector de area.
	return s0=='' || s0=='all' || item.fila[CAMPO.area]==s0;
}

function cabeceraPais(results,area){
	// Crea y añade la cabecera en negrita de un pais y la devuelve.
	const header=document.createElement('li');
	header.style.listStyleType='none';
	header.innerHTML=esc(area);
	header.style.fontWeight='bold';
	results.appendChild(header);
	return header;
}

function pasaFiltros(item,s2,s3,s4){
	// true si el item pasa los filtros de fecha (s4), tipo (s3) y ciudad (s2).
	if (s4!='' && s4!='all' && item.fechas.indexOf(s4)==-1){ return false; }
	if (s3!='' && s3!='all' && filtra(s3,item.tipo)==-1){ return false; }
	if (s2!='' && s2!='all' && s2!=item.ciudad){ return false; }
	return true;
}

function cierraCabecera(header,contadorL2){
	// Añade el contador a la cabecera del pais; si el grupo quedo vacio, la borra.
	header.innerHTML+='<span class="cuenta">&nbsp;('+contadorL2+')</span>';
	if (contadorL2==0){ header.parentNode.removeChild(header); }
}

function celdasVenue(mapa,venue){
	// las 9 celdas del venue en la tabla de su ciudad: 0-6 los dias (domingo
	// = 0), 7 la url del venue, 8 las milongas sin dia ('consultar')
	if (!mapa.has(venue)){ mapa.set(venue,['','','','','','','','','']); }
	return mapa.get(venue);
}

function apuntaRegular(mapa,vistos,item){
	// la milonga en la tabla de su ciudad (mapa: venue -> celdas; vistos:
	// las ya puestas). true si cuenta como linea nueva
	if (item.tipo=='venue'){ celdasVenue(mapa,item.nombre)[7]=item.url; }
	const esReg=item.fechas.split('.')[0]=='REG';
	if (!esReg && item.tipo!='milonga'){ return false; }
	const venue=(item.varios.loc||[''])[0];
	// legado: milonga con fechas='' (sin dia ni hora): consultar
	const clave=venue+'#'+(esReg ? item.fechas : '?')+'#'+item.nombre;
	if (vistos.has(clave)){ return false; }
	vistos.add(clave);
	const valor=celdasVenue(mapa,venue);
	// leeReg (aux.js): una milonga de varios días va en cada uno; la
	// mensual, con sus semanas detrás de la hora (2nd,4th)
	const reg=esReg ? leeReg(item.fechas) : null;
	let hora=reg ? reg.hora : '';
	if (reg && reg.frec=='M'){hora=(hora ? hora+' ' : '')+semanasReg(reg.semanas)}
	if (!reg || !reg.dias.length){
		// dia desconocido (REG.W.?.hora o sin fecha): 'consultar' en las
		// celdas de la semana, con la hora si la hay
		valor[8]=(valor[8]||'')+item.nombre+'|'+item.url+'|'+hora+'#';
	}else{
		for (const d of reg.dias){ valor[d]+=hora+'|'+item.nombre+'|'+item.url+'#'; }
	}
	return true;
}

function renderRegular(s0,s1,s2,s3,s4){
	// Vista regular: agrupa las milongas REG por pais, ciudad y venue y las
	// pinta en una tabla semanal (getTable). Devuelve el total de lineas.
	const results=document.getElementById('resultados');
	results.innerHTML='';
	let contadorL1=0;
	for (const area of listaPaises(s0,s1)) {
		if (omitirPais(area,s0,s1,s2)){continue}
		const entradas=damelista(area);
		if (entradas.length==0){continue}
		const header=cabeceraPais(results,area);
		let contadorL2=0;
		const porCiudad=new Map();   // ciudad -> {mapa: venue -> celdas, vistos}
		for (const item of entradas) {
			if (!pasaFiltros(item,s2,s3,s4) || !enArea(item,s0)){continue}
			if (!porCiudad.has(item.ciudad)){ porCiudad.set(item.ciudad, { mapa: new Map(), vistos: new Set() }); }
			const { mapa, vistos } = porCiudad.get(item.ciudad);
			if (apuntaRegular(mapa,vistos,item)){
				filasVisibles.add(item.fila);
				contadorL2+=1;
			}
		}
		porCiudad.forEach(({ mapa }, ciudad) => {
			const tabla=getTable(mapa);
			if (tabla!=''){
				const caja=document.createElement('div');
				caja.className='cTabla';
				caja.innerHTML=esc(ciudad)+'<br/>'+tabla;
				results.appendChild(caja);
			}
		});
		contadorL1+=contadorL2;
		cierraCabecera(header,contadorL2);
	}
	results.innerHTML+='<br/><br/>';
	return contadorL1;
}

function getTable(dataMap){
	// Construye la tabla semanal de una ciudad: una fila por venue y una
	// columna por dia (lunes a domingo). values[0..6] son los dias (0=domingo)
	// con bloques 'hora|nombre|url#'; values[7] es la url del venue.
	const ordenColumnas=[1,2,3,4,5,6,0];
	let filas=0;
	let html="<table>";
	html+="<tr><th>venue</th><th>monday</th><th>tuesday</th><th>wednesday</th><th>thursday</th><th>friday</th><th>saturday</th><th>sunday</th></tr>";

	for (const [venue, values] of dataMap) {
		// venue sin ninguna milonga (ni REG ni sin dia): no pintar fila vacia
		const sinDia=ordenColumnas.every(d => !values[d]);
		if (sinDia && !values[8]){continue}
		html+="<tr>";
		let vurl=values[7]||'';
		html+="<td>"+(vurl ? "<a href='"+esc(vurl)+"' target='_blank'>" : "")+esc(venue)+(vurl ? "</a>" : "");
		// milongas sin dia fijo: bajo el nombre del venue; sus horas (si las
		// hay) se acumulan para pintarlas con 'consultar' en las celdas
		let consultarCelda='';
		(values[8]||'').split('#').forEach(bloque => {
			if (bloque==''){return}
			let [nombre,url,hora]=bloque.split('|');
			url=url||''; hora=hora||'';
			html+="<br/>"+(url ? "<a href='"+esc(url)+"' target='_blank'>" : "")+
				"<span class='azul'>"+esc(nombre)+"</span>"+(url ? "</a>" : "")+" (?)";
			if (sinDia){
				consultarCelda+=(consultarCelda ? "<br/>" : "")+(hora ? hora+"<br/>" : "")+"consultar";
			}
		});
		html+="</td>";

		ordenColumnas.forEach(dia => {
			let lineas=[];
			(values[dia]||'').split('#').forEach(bloque => {
				if (bloque==''){return}
				let [hora,nombre,url]=bloque.split('|');
				url=url||'';
				let enlace=(url ? "<a href='"+esc(url)+"' target='_blank'>" : "")+
					"<span class='azul'>"+esc(nombre)+"</span>"+(url ? "</a>" : "");
				// sin hora: solo el nombre, sin linea vacia encima
				lineas.push(hora ? hora+"<br/>"+enlace : enlace);
			});
			// milonga sin dia: 'consultar' (con su hora si la hay) en cada celda
			html+="<td>"+(lineas.length ? lineas.join('<br/>') : (sinDia ? consultarCelda : ""))+"</td>";
		});
		html+="</tr>";
		filas+=1;
	}
	html+="</table>";
	return filas>0 ? html : '';
}

// ── piezas de las vistas countries y annual ──

function nuevoLi(margen){
	// <li> de un elemento del listado
	const li=document.createElement('li');
	li.style.listStyleType='circle';
	li.style.marginLeft=margen;
	return li;
}

function agregaEnlace(li,url){
	// enlace ↗️ a url detras del texto del li
	li.appendChild(document.createTextNode(' '));
	const link=document.createElement('a');
	link.href=url;
	link.innerHTML=icon('external');
	link.target='_blank';
	li.appendChild(link);
}

function etiquetaTipo(item){
	// roles (personas) o etiqueta de color del tipo (eventos); '' sin tipo
	if (item.tipo=='' || item.tipo=='-'){return ''}
	if (app=='people' || !esEvento(item.tipo)){return spanRoles(item.tipo)}
	const color=colorTipo.get(item.tipo) || '#DDD';
	return '<span class="stipo" style="background-color:'+color+'">'+get3(item.tipo)+'</span>';
}

function fechaOComentario(item){
	// {fecha, coment}: fecha EVT/REG (eventos) o comentario privado (people,
	// campo 7, separado por ','): sus urls con icono (▶️ YouTube, 🌐 otra
	// web) en fecha y el texto en coment (va en otro parentesis detras)
	const campo7=item.fechas || item.privado || '';
	if (campo7=='' || campo7=='-'){return {fecha:'', coment:''}}
	const prt=campo7.split('.');
	if (prt[0]=='REG'){return {fecha:'<div class="itemLinea">'+esc(textoReg(campo7))+'</div>', coment:''}}
	if (prt[0]=='EVT'){return {fecha:'<div class="itemLinea">'+prt[2]+'.'+prt[4]+'</div>', coment:''}}
	const resto=sinUrls(campo7);
	return {fecha:urlsDe([campo7]).map(iconoUrl).join(' '), coment:resto ? '<div class="itemLinea">'+esc(resto)+'</div>' : ''};
}

function textoPersona(item,etiqueta,fc){
	// app people: ciudad : nombre : roles : campo 6 (los txt como texto; vid,
	// www y las urls de los txt con icono; contactos) : fecha o comentario
	const ciudad=item.ciudad!='' ? '<div class="sCity">'+esc(item.ciudad)+'&nbsp;</div>' : '';
	const textos=(item.varios.txt||[]).map(sinUrls).filter(Boolean);
	let varios=textos.length ? '<div class="itemLinea">'+esc(textos.join(', '))+'&nbsp;</div>' : '';
	varios+=iconosVarios(item.varios,item.url);
	const scont=contactosVarios(item.varios);
	if (scont) varios+=' '+scont;
	const sfoto=iconoFoto(item.idfoto,false);
	return ciudad+' : '+esc(item.nombre)+' : '+etiqueta.replace('event ','')+
		' : '+varios+' : '+(fc.fecha||fc.coment)+(sfoto ? ' '+sfoto : '');
}

function textoElemento(item,etiqueta,fc){
	// eventos (y personas en la app de eventos): [etiqueta] ciudad, ⭐nombre
	// (roles) (fecha 👤 ↗️ ▶️ 🌐 contactos) [sala o texto] (comentario);
	// sin parentesis vacios, unica coma detras de la ciudad
	const scity=(item.ciudad!='' && item.ciudad!='-') ? esc(item.ciudad)+',&nbsp;' : '';
	const fav=String(item.tipo).startsWith('event') ? iconoFav(item.nombre,item.ciudad) : '';
	const slink=(item.url!='' && item.url!='-') ?
		'<a href="'+item.url.replace(/"/g,'%22')+'" target="_blank">'+icon('external')+'</a>' : '';
	const swww=[iconosVarios(item.varios,item.url),contactosVarios(item.varios)].filter(Boolean).join(' ');
	const sfoto=iconoFoto(item.idfoto,esEvento(item.tipo));    // foto 👤: eventos, la portada antes
	const dentro=[fc.fecha,sfoto,slink,swww].filter(Boolean).join(' ');
	const esPersona=!esEvento(item.tipo);
	const delante=esPersona ? '' : etiqueta.replace('event','').trim()+'&nbsp;';
	const sroles=(esPersona && etiqueta) ? '&nbsp;('+spanRoles(item.tipo,' ')+')' : '';
	const autor=sinUrls((item.varios.loc||item.varios.txt||[''])[0]);   // la sala de una milonga (loc) o el texto (txt)
	return delante+scity+fav+esc(item.nombre)+sroles+(dentro ? '&nbsp;('+dentro+')' : '')+
		(autor ? '&nbsp;['+esc(autor)+']' : '')+(fc.coment ? '&nbsp;('+fc.coment+')' : '');
}

function renderCountries(s0,s1,s2,s3,s4){
	// Vista por defecto: lista por pais cada evento/persona que pasa los
	// filtros, con su badge de tipo, ciudad, nombre, autor, fecha y enlace.
	const results=document.getElementById('resultados');
	results.innerHTML='';
	let contadorL1=0;
	for (const area of listaPaises(s0,s1)) {
		if (omitirPais(area,s0,s1,s2,s3)){continue}
		const entradas=damelista(area);
		if (entradas.length==0){continue}
		const header=cabeceraPais(results,area);
		let contadorL2=0;
		for (const item of entradas) {
			if (!pasaFiltros(item,s2,s3,s4) || !enArea(item,s0) || !pasaFav2(item)){continue}
			filasVisibles.add(item.fila);
			contadorL2+=1;
			const li=nuevoLi('10px');
			const span=document.createElement('span');
			li.appendChild(span);
			const etiqueta=etiquetaTipo(item), fc=fechaOComentario(item);
			item.texto=app=='people' ? textoPersona(item,etiqueta,fc) : textoElemento(item,etiqueta,fc);
			span.innerHTML=item.texto;
			if (app=='people' && item.url!='' && item.url!='-'){agregaEnlace(li,item.url)}
			results.appendChild(li);
		}
		contadorL1+=contadorL2;
		cierraCabecera(header,contadorL2);
	}
	results.innerHTML+='<br/><br/>';
	return contadorL1;
}

const COLOR_MES=['#BFD7EA','#E8C2CA','#B4E197','#F7E1D7','#FFF1B5','#FFD6A5',
	'#FFB3B3','#F6D7B0','#D0E6A5','#E7BFB1','#D1BFA7','#C6D8FF'];   // vista annual: un color por mes

function entradaAnual(i){
	// objeto de la fila i para la vista annual (null si no es un EVT visible):
	// los ya pasados se reprograman al proximo año futuro (estimado)
	const o=getObj(i);
	if (o.fechas.split('.')[0]!='EVT' || ocultoEnAnual(o.tipo)){return null}
	const p=o.fechas.split('.');
	const actual=new Date();
	let year=p[4];
	const mes=parseInt(p[1]);
	const dia=p[3].split('-')[0];
	// dia sin fijar (EVT.mes.MES.?.año): va al principio de su mes, con
	// '??', y no pasa hasta que acaba el mes
	const sinDia=(dia=='?');
	const fin=(y)=>(sinDia ? new Date(y,mes+1,0) : new Date(y,mes,dia));
	if (fin(year)<actual){ year=actual.getFullYear(); }
	if (fin(year)<actual){ year++; }
	// arrastrado: la edición publicada ya pasó y se repite en el año
	// siguiente hasta que exista la nueva (fecha estimada)
	o.estimado=(String(year)!=p[4]);
	o.ofecha=new Date(year,mes,sinDia ? 1 : dia);
	o.colorMes=mes;
	const pdia=(sinDia ? '??' : dia.toString().padStart(2, '0'));
	o.pfecha=o.ofecha.getFullYear()+'.'+meses[o.ofecha.getMonth()]+' '+pdia;
	o.pfecha2='&nbsp'.repeat(9)+pdia;
	return o;
}

function sinFiltro(s){
	// selector sin filtro: vacio o 'all'
	return s=='' || s=='all';
}

function textoAnual(item,mismoMes){
	// fecha (de color por mes; si sigue el mismo mes, solo el dia) tipo ⭐nombre (ciudad,pais) ⏳
	let tipo=item.tipo.replace('event ','').trim();
	if (tipo=='championship'){ tipo='champion'; }
	const stipo=tipo=='' ? '' : '<span class="stipo3" style="color:#444;background-color:'+colorTipo.get(item.tipo)+
		'">'+esc(tipo)+'&nbsp;'.repeat(Math.max(1,10-tipo.length))+'</span>';   // relleno a 10: columnas alineadas al copiar/pegar
	const sfecha=item.pfecha=='' ? '' : '<span class="fechaCompacta" style="background-color:'+COLOR_MES[item.colorMes]+
		'">'+(mismoMes ? item.pfecha2 : item.pfecha)+'&nbsp;</span>';
	let nombre=item.nombre;
	const corte=window.innerWidth/20;
	if (nombre.length>corte){ nombre=nombre.substring(0,corte)+' ..'; }
	// sin favorito (y con favoritos cargados): 3 blancos en el hueco del emoji
	const snombre='<span>'+(iconoFav(item.nombre,item.ciudad)||(favLista.length ? '&nbsp;'.repeat(3) : ''))+esc(nombre)+'</span>';
	return sfecha+stipo+'&nbsp;'+snombre+'&nbsp;('+esc(item.ciudad)+','+esc(item.pais)+')'+
		(item.estimado ? '&nbsp;<span title="fecha estimada: repite la edición anterior">&#9203;</span>' : '');
}

function renderAnnualCompact(s0,s1,s2,s3,s4){
	// Vista annual: lista solo eventos EVT ordenados por fecha. Los ya pasados
	// se reprograman al proximo año futuro; se colorea por mes y se agrupa el
	// dia bajo el mismo mes. Aplica los filtros area/pais/ciudad/tipo/fecha.
	const results=document.getElementById('resultados');
	results.innerHTML='';
	const entradas=[];
	for (let i=0;i<datos.length;i++){
		if (!sinFiltro(s0) && datos[i][CAMPO.area]!=s0){continue}
		const o=entradaAnual(i);
		if (o){entradas.push(o)}
	}
	entradas.sort(function(a, b){return a.ofecha-b.ofecha})
	const a3=s3.split(',');
	let contadorL1=0, mesAnterior=-1;
	for (const item of entradas) {
		if (!sinFiltro(s4) && item.fechas.indexOf(s4)==-1){continue}
		if (!sinFiltro(s3) && a3.indexOf(item.tipo)==-1){continue}
		if (!sinFiltro(s2) && s2!=item.ciudad){continue}
		if (!sinFiltro(s1) && s1!=item.pais){continue}
		if (!pasaFav2(item)){continue}
		filasVisibles.add(item.fila);
		contadorL1+=1;
		const li=nuevoLi('20px');
		const span=document.createElement('span');
		item.texto=textoAnual(item,item.colorMes==mesAnterior);
		mesAnterior=item.colorMes;
		span.innerHTML=item.texto;
		li.appendChild(span);
		if (item.url){agregaEnlace(li,item.url)}
		results.appendChild(li);
	}
	results.innerHTML+='<br/><br/>';
	return contadorL1;
}

function render(s0,s1,s2,s3,s4,s5){
	// Despacha a la vista activa (regular/annual/countries) y actualiza el
	// contador total del sumario.
	let contadorL1;
	filasVisibles.clear();
	if (s5=='regular'){
		contadorL1=renderRegular(s0,s1,s2,s3,s4);
	}else if (s5=='annual'){
		contadorL1=renderAnnualCompact(s0,s1,s2,s3,s4);
	}else{
		contadorL1=renderCountries(s0,s1,s2,s3,s4);
	}
	const sumario=document.getElementById('sumario');
	sumario.innerHTML='&#128202;<span>'+' total : '+contadorL1+'</span><br/><br/>';
}
